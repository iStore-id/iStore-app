<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#155dbd" />
    <meta name="description" content="Platform top up game dan voucher digital terpercaya di Indonesia" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/api/public/pwa-manifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/istore-192.png" />
    <link rel="apple-touch-icon" href="/icons/istore-192.png" />
    <title>TEMAN GAMES - Top Up Game &amp; Voucher</title>
    <meta property="og:title" content="TEMAN GAMES - Top Up Game &amp; Voucher" />
    <meta property="og:description" content="Platform top up game dan voucher digital terpercaya di Indonesia" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          fetch("/api/public/config/midtrans")
            .then(function(res) { return res.json(); })
            .then(function(data) {
              if (data && data.success && data.data && data.data.clientKey) {
                if (!document.getElementById("midtrans-snap-script")) {
                  var script = document.createElement("script");
                  script.id = "midtrans-snap-script";
                  script.src = data.data.isProduction
                    ? "https://app.midtrans.com/snap/snap.js"
                    : "https://app.sandbox.midtrans.com/snap/snap.js";
                  script.setAttribute("data-client-key", data.data.clientKey);
                  script.async = true;
                  document.head.appendChild(script);
                }
              }
            })
            .catch(function() {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
