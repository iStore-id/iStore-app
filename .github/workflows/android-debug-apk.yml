name: Android Debug APK

on:
  push:
    branches:
      - prepare/google-play-twa-config
    paths:
      - "android/**"
      - "twa-manifest.json"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - "twa-manifest.json"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.1.0

      - name: Generate launcher icons from owner-configured public branding
        run: python android/scripts/generate_launcher_icons.py

      - name: Validate Android identity and launcher configuration
        shell: bash
        run: |
          grep -q 'applicationId = "id.istore.app"' android/app/build.gradle.kts
          grep -q 'DEFAULT_URL' android/app/src/main/AndroidManifest.xml
          grep -q 'https://ist.web.id/' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Verify APK artifact
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: istore-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
